{% load ui %}
<div class="blueprint" style="background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)">
  <div class="bp-head" style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #E2E8F0;font-size:9px;letter-spacing:.06em;color:#64748B;text-transform:uppercase;font-weight:700">
    <span>Engineering drawing · {{ tpl.part_no|truncatechars:18 }} Rev {{ tpl.rev }}</span>
    <span class="mono">DRG-{{ tpl.part_no }}-{{ tpl.rev }}.pdf · sheet 1/1</span>
  </div>
  <svg viewBox="0 0 520 300" style="width:100%;display:block;background:#F7F9FC" role="img" aria-label="Shaft engineering drawing with inspection pins">
    <defs>
      <marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 z" fill="#334155"/>
      </marker>
    </defs>
    <!-- centre line -->
    <line x1="30" y1="150" x2="490" y2="150" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="8 3 2 3"/>
    <!-- shaft profile -->
    <path d="M70 150 L70 118 L150 118 L150 100 L300 100 L300 118 L400 118 L400 134 L450 134 L450 166 L400 166 L400 182 L300 182 L300 200 L150 200 L150 182 L70 182 Z"
          fill="#E8EEF6" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- steps / hidden lines -->
    <line x1="150" y1="100" x2="150" y2="200" stroke="#64748B" stroke-width="0.9"/>
    <line x1="300" y1="100" x2="300" y2="200" stroke="#64748B" stroke-width="0.9"/>
    <line x1="400" y1="118" x2="400" y2="182" stroke="#64748B" stroke-width="0.9"/>
    <!-- datum -->
    <line x1="70" y1="70" x2="70" y2="230" stroke="#0EA5A0" stroke-width="1.1" stroke-dasharray="5 3"/>
    <circle cx="70" cy="238" r="8" fill="none" stroke="#0EA5A0" stroke-width="1.1"/>
    <text x="70" y="242" font-size="9" text-anchor="middle" fill="#0EA5A0" font-family="ui-monospace">A</text>
    <!-- dimension: overall length -->
    <line x1="70" y1="238" x2="450" y2="238" stroke="#334155" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <rect x="222" y="230" width="86" height="15" fill="#F7F9FC"/>
    <text x="265" y="241" font-size="9.5" text-anchor="middle" fill="#1E293B" font-family="ui-monospace">118.50 ±0.30</text>
    <!-- dimension: OD -->
    <line x1="340" y1="112" x2="340" y2="188" stroke="#334155" stroke-width="0.9" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <rect x="300" y="74" width="84" height="15" fill="#F7F9FC"/>
    <text x="342" y="85" font-size="9.5" text-anchor="middle" fill="#1E293B" font-family="ui-monospace">Ø32.00 +0/−0.02</text>
    <!-- runout callout -->
    <line x1="430" y1="140" x2="468" y2="112" stroke="#334155" stroke-width="0.8"/>
    <rect x="434" y="92" width="80" height="15" fill="#F7F9FC"/>
    <text x="474" y="103" font-size="8.5" text-anchor="middle" fill="#1E293B" font-family="ui-monospace">RUNOUT 0.02 MAX</text>
    <!-- title block -->
    <rect x="300" y="252" width="190" height="38" fill="#fff" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="300" y1="265" x2="490" y2="265" stroke="#94A3B8" stroke-width="0.6"/>
    <line x1="300" y1="278" x2="490" y2="278" stroke="#94A3B8" stroke-width="0.6"/>
    <line x1="392" y1="252" x2="392" y2="290" stroke="#94A3B8" stroke-width="0.6"/>
    <text x="306" y="261" font-size="7.5" fill="#475569" font-family="ui-monospace">{{ tpl.name|truncatechars:26 }}</text>
    <text x="306" y="274" font-size="7" fill="#64748B" font-family="ui-monospace">{{ tpl.part_no }} · REV {{ tpl.rev }}</text>
    <text x="306" y="287" font-size="7" fill="#64748B" font-family="ui-monospace">SCALE 1:1 · UNITS mm</text>
    <text x="398" y="261" font-size="7" fill="#64748B" font-family="ui-monospace">SHEET 1/1</text>
    <text x="398" y="274" font-size="7" fill="#64748B" font-family="ui-monospace">ZAPUZA ENGG</text>
    <text x="398" y="287" font-size="7" fill="#64748B" font-family="ui-monospace">{{ tpl.rev }} · 2026</text>

    <!-- inspection pins -->
    {% for f in fields %}
      {% if f.pin_x or f.pin_y %}
        <g transform="translate({% widthratio f.pin_x 100 520 %}, {% widthratio f.pin_y 100 300 %})">
          <circle r="11" fill="{% if f.ctq %}#F6B33C{% else %}#0EA5A0{% endif %}" stroke="#fff" stroke-width="2"/>
          <text y="3.6" font-size="10" text-anchor="middle" fill="#04241C" font-weight="700" font-family="ui-monospace">{{ forloop.counter }}</text>
          <title>{{ f.name }} · {{ f.spec_text }}{% if f.ctq %} (CTQ){% endif %}</title>
        </g>
      {% endif %}
    {% endfor %}
  </svg>
  <div style="display:flex;gap:14px;padding:7px 12px;font-size:10px;color:#475569;background:#fff;border-top:1px solid #E2E8F0">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#0EA5A0;margin-right:5px"></span>Inspection pin</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#F6B33C;margin-right:5px"></span>CTQ pin</span>
    <span style="margin-left:auto">Pins are placed on the drawing — the inspector cannot confuse which dimension they are measuring.</span>
  </div>
</div>
